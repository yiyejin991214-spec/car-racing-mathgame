<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<title>선생님 - 수학 레이싱</title>
<script src="config.js"></script><script src="common.js"></script>
</head><body><main class="wrap">

<section id="v-setup" class="view glass narrow">
  <h1>🏁 수학 레이싱</h1><p>6학년 수학 문제를 풀수록 자동차가 달려요.</p>
  <h3>문제 단원 (여러 개 선택)</h3><div id="topics" class="chips"></div>
  <h3>게임 시간</h3>
  <select id="dur"><option value="60">1분</option><option value="120" selected>2분</option><option value="180">3분</option></select>
  <p><label><input type="checkbox" id="boost" checked style="width:auto"> 🎁 부스터 상자 (뒤처진 친구에게 더 자주)</label></p>
  <button id="create" class="btn btn-violet">방 만들기</button><p id="err" class="err"></p>
</section>

<section id="v-lobby" class="view lobby" hidden>
  <div class="glass center">
    <h2 class="en">Math Race</h2><p>휴대폰 카메라로 찍고 들어오세요</p>
    <div id="qr"></div><p>방 번호</p><div id="code" class="code num"></div>
    <small id="url" style="word-break:break-all"></small>
  </div>
  <div class="glass">
    <div><span class="pill" id="ltopics"></span></div>
    <h3>들어온 선수들 <span id="cnt" class="num">0</span>명</h3>
    <div id="grid" class="grid"></div>
    <div style="display:flex;justify-content:space-between">
      <button id="delBtn2" class="btn btn-ghost">방 지우기</button>
      <button id="start" class="btn btn-violet" disabled>▶ 게임 시작</button>
    </div>
  </div>
</section>

<section id="v-play" class="view" hidden>
  <div class="glass top">
    <div><b class="en" style="font-size:22px">Math Race</b><br><small id="pinfo"></small></div>
    <div id="gold" class="gold" hidden></div>
    <div class="btns">
      <div class="timer"><svg width="48" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="#e3dcf7" stroke-width="4"/><circle id="ring" cx="18" cy="18" r="16" fill="none" stroke="#5b3fb0" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" transform="rotate(-90 18 18)"/></svg><b id="tm" class="num">00:00</b></div>
      <button id="goldBtn" class="btn btn-yellow">⚡ 골든 타임</button>
      <button id="blindBtn" class="btn btn-ghost">블라인드</button>
      <button id="endBtn" class="btn btn-pink">게임 종료</button>
    </div>
  </div>
  <div class="play">
    <div class="glass"><h2>실시간 레이스 🏎️</h2><small>점수 = 맞힌 문제 + 보너스 (상위 12명)</small>
      <div id="race" class="race"></div></div>
    <div>
      <div class="glass stat">
        <div><small>전체 정답률</small><b id="s1" class="num">0%</b></div>
        <div><small>푼 문제 합계</small><b id="s2" class="num">0</b></div>
        <div><small>보너스 합계</small><b id="s3" class="num">0</b></div>
        <div><small>어려운 단원</small><b id="s4" style="font-size:16px">-</b></div>
      </div>
      <div class="glass"><h3>방금 일어난 일</h3><div id="news" class="news"></div></div>
    </div>
  </div>
</section>

<section id="v-result" class="view center" hidden>
  <h1>🏆 오늘의 레이싱 챔피언</h1>
  <div id="podium" class="podium"></div><div id="rest" style="margin-top:14px"></div>
  <p><button id="delBtn" class="btn btn-ghost">학생 기록 지우기</button> <button id="newBtn" class="btn btn-violet">새 게임 만들기</button></p>
</section>
</main><div id="sync" class="sync"></div>

<script>
let saved = JSON.parse(localStorage.getItem('mrace-room') || 'null'), room = null, players = [], prev = {}, prevRank = {}, news = [],
    ending = false, qrFor = '', sync = null, celebrated = false, hard = '-';
const sel = new Set(Object.keys(TOPICS));
const call = (fn, x = {}) => rpc(fn, { p_room: saved.id, p_code: saved.code, ...x });

/* Step 2: 방 만들기 */
Object.entries(TOPICS).forEach(([k, v]) => {
  const b = el('button', 'chip on', v);
  b.onclick = () => { sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle('on'); $('#create').disabled = !sel.size; };
  $('#topics').append(b);
});
$('#create').onclick = async () => {
  try {
    $('#err').textContent = '';
    const r = await rpc('create_room', { p_topics: [...sel], p_duration: +$('#dur').value, p_boost: $('#boost').checked });
    saved = { id: r.room_id, code: r.teacher_code }; localStorage.setItem('mrace-room', JSON.stringify(saved));
    celebrated = false; await refresh();
  } catch (e) { $('#err').textContent = e.message; }
};
function forget() {
  localStorage.removeItem('mrace-room'); saved = null; room = null; prev = {}; news = []; ending = false;
  if (sync) { sync.stop(); sync = null; } show('v-setup');
}

async function refresh() {
  try {
    if (!saved) { show('v-setup'); return; }
    const [a, b] = await Promise.all([
      db.from('rooms').select('*').eq('id', saved.id).maybeSingle(),
      db.from('players').select('*').eq('room_id', saved.id)]);
    if (!a.data) { forget(); return; }
    room = a.data; players = rankSort(b.data || []);
    if (!sync) { await syncClock(); sync = startSync([{ table: 'rooms', filter: 'id=eq.' + saved.id }, { table: 'players', filter: 'room_id=eq.' + saved.id }], refreshT); }
    if (room.status === 'waiting') lobby(); else if (room.status === 'playing') play(); else result();
  } catch (e) { console.error(e); }
}
const refreshT = throttle(refresh, 400);

function lobby() {
  show('v-lobby'); $('#code').textContent = room.id;
  const url = location.origin + location.pathname.replace(/[^/]*$/, '') + 'student.html?code=' + room.id;
  if (qrFor !== url) { qrFor = url; const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); $('#qr').innerHTML = qr.createSvgTag(5, 0); }
  $('#url').textContent = url;
  $('#ltopics').textContent = room.topics.map(t => TOPICS[t]).join(' · ') + ' · ' + room.duration / 60 + '분' + (room.boost_on ? ' · 부스터 상자' : '');
  $('#cnt').textContent = players.length;
  $('#grid').replaceChildren(...players.map(p => { const d = el('div', 'pl'); d.append(el('div', 'big', p.animal), el('small', '', p.nickname)); return d; }));
  $('#start').disabled = !players.length;
}

/* Step 3: 시작 · 종료 · 타이머(서버 시계) */
$('#start').onclick = () => call('start_game').then(refresh).catch(e => alert(e.message));
$('#endBtn').onclick = () => confirm('게임을 끝낼까요?') && call('end_game').then(refresh);
$('#goldBtn').onclick = () => call('set_golden').then(refresh);
$('#blindBtn').onclick = () => call('set_blind', { p_on: !room.blind }).then(refresh);
const del = () => confirm('방과 학생 기록을 모두 지울까요?') && call('delete_room').then(forget);
$('#delBtn').onclick = del; $('#delBtn2').onclick = del; $('#newBtn').onclick = forget;

setInterval(() => {
  if (!room || room.status !== 'playing') return;
  const left = Date.parse(room.ends_at) - now();
  $('#tm').textContent = mmss(left);
  $('#ring').style.strokeDashoffset = 100.5 * (1 - Math.max(0, Math.min(1, left / (room.duration * 1000))));
  const g = room.golden_until ? Date.parse(room.golden_until) - now() : 0;
  $('#gold').hidden = g <= 0; $('#gold').textContent = '⚡ 골든 타임! 정답 2점 · ' + Math.ceil(g / 1000) + '초';
  $('#goldBtn').disabled = g > 0;
  if (left <= 0 && !ending) { ending = true; call('end_game').then(refresh).catch(() => ending = false); }
}, 250);

/* Step 4~6: 레이스 · 통계 · 소식 */
function push(t, hot) { news.unshift({ t, hot }); news = news.slice(0, 5); }
function play() {
  show('v-play');
  $('#pinfo').textContent = `방 번호 ${room.id} · ${players.length}명 참여 중`;
  $('#blindBtn').textContent = room.blind ? '블라인드 해제' : '블라인드';
  const rk = {}; players.forEach((p, i) => rk[p.id] = i + 1);
  if (Object.keys(prev).length) players.forEach(p => {
    const o = prev[p.id]; if (!o) return;
    if (p.bonus > o.bonus) push(`${p.nickname} 부스터 상자 +${p.bonus - o.bonus}!`, 1);
    else if (rk[p.id] < prevRank[p.id]) push(`${p.nickname} ${rk[p.id]}위로 올라섰어요`);
  });
  prev = Object.fromEntries(players.map(p => [p.id, { bonus: p.bonus }])); prevRank = rk;
  race(); stats();
  $('#news').replaceChildren(...news.map(n => el('div', n.hot ? 'hot' : '', n.t)));
}
function race() {
  const box = $('#race'), top = players.slice(0, 12), max = Math.max(10, top[0] ? top[0].score : 0);
  box.style.height = top.length * 52 + 'px';
  box.classList.toggle('blind', room.blind);
  let bm = $('#bm'); if (room.blind && !bm) { bm = el('div', 'blindmsg', '🙈 순위 비공개! 끝까지 지켜보세요'); bm.id = 'bm'; box.parentElement.append(bm); } if (!room.blind && bm) bm.remove();
  const ids = new Set(top.map(p => p.id));
  $$('.lane', box).forEach(l => { if (!ids.has(l.dataset.id)) l.remove(); });
  top.forEach((p, i) => {
    let l = $(`.lane[data-id="${p.id}"]`, box);
    if (!l) {
      l = el('div', 'lane'); l.dataset.id = p.id;
      const road = el('div', 'road'); road.append(el('span', 'car'), el('i', 'sc num'));
      l.append(el('b', 'rk num'), el('span', 'nm'), road); box.append(l);
    }
    l.style.transform = `translateY(${i * 52}px)`;
    $('.rk', l).textContent = i + 1; $('.nm', l).textContent = p.nickname;
    const c = $('.car', l); c.textContent = p.animal; c.style.left = `calc((100% - 70px) * ${Math.min(1, p.score / max)})`;
    $('.sc', l).textContent = p.score;
  });
}
function stats() {
  const sc = players.reduce((a, p) => a + p.correct, 0), ss = players.reduce((a, p) => a + p.solved, 0);
  $('#s1').textContent = (ss ? Math.round(sc / ss * 100) : 0) + '%'; $('#s2').textContent = ss;
  $('#s3').textContent = players.reduce((a, p) => a + p.bonus, 0); $('#s4').textContent = hard;
}
setInterval(async () => {
  if (!room || room.status !== 'playing') return;
  const { data } = await db.from('answers').select('topic,correct').eq('room_id', room.id);
  const m = {}; (data || []).forEach(a => { const t = m[a.topic] || (m[a.topic] = [0, 0]); t[1]++; if (a.correct) t[0]++; });
  const w = Object.entries(m).filter(([, v]) => v[1] >= 3).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1])[0];
  hard = w ? TOPICS[w[0]] : '-';
}, 5000);

/* Step 5: 시상대 */
function card(p, n, cls) {
  const d = el('div', 'glass ' + cls);
  d.append(el('div', 'big num', n), el('div', 'big', p.animal), el('div', '', p.nickname), el('b', 'num', p.score + '점'), el('div', '', `정답 ${p.correct} · 보너스 +${p.bonus}`));
  return d;
}
function result() {
  show('v-result');
  $('#podium').replaceChildren(...[0, 1, 2].filter(i => players[i]).map(i => card(players[i], i + 1, 'pd pd' + (i + 1))));
  $('#rest').replaceChildren(...players.slice(3).map((p, i) => {
    const r = el('div', 'rowp'); r.append(el('span', '', `${i + 4}. ${p.animal} ${p.nickname}`), el('span', 'num', `${p.score}점 (정답 ${p.correct} · 보너스 +${p.bonus})`)); return r;
  }));
  if (!celebrated) { celebrated = true; confetti({ particleCount: 160, spread: 90, origin: { y: .4 } }); }
}
refresh();
</script></body></html>
